name: Backend — CI / CD

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # CI — Compile + Test
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Compile & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mformusic_test
          MYSQL_ROOT_PASSWORD: testpwd
          MYSQL_USER: mformusic
          MYSQL_PASSWORD: testpwd
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: mformusic_test
          DB_USER: mformusic
          DB_PASSWORD: testpwd
          JWT_SECRET: ci-test-secret-key-32-chars-minimum
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-key
          SUPABASE_BUCKET: tracks
          MLOPS_FASTAPI_ENABLED: "false"
        run: ./mvnw test -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────────────
  # CD — Build Docker image + Deploy to Render
  # Runs only on main branch pushes after tests pass
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy Hook
        # Set RENDER_DEPLOY_HOOK_BACKEND in GitHub repo secrets
        # Get this URL from Render dashboard → your service → Settings → Deploy Hook
        if: secrets.RENDER_DEPLOY_HOOK_BACKEND != ''
        run: |
          curl -s --fail-with-body \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" \
            | jq .
