spring.application.name=backend

# ── MySQL Database (Aiven Cloud) ──────────────────────────────────────────────
# All five variables below MUST be set as environment variables in production.
# DB_HOST     → Aiven service hostname  (e.g. mysql-xxxxx.aivencloud.com)
# DB_PORT     → Aiven service port      (e.g. 22486)
# DB_NAME     → Database / schema name  (e.g. mformusic_db)
# DB_USER     → Database username       (e.g. avnadmin)
# DB_PASSWORD → Database password
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool — tuned for Render.com free-tier container
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# JWT_SECRET must be set in production — minimum 32 characters, random string.
# Never commit the actual secret to source control.
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=604800000

# ── Supabase Storage ──────────────────────────────────────────────────────────
# SUPABASE_URL      → Project URL   (e.g. https://xxxx.supabase.co)
# SUPABASE_ANON_KEY → anon/public API key from Supabase dashboard → Settings → API
# SUPABASE_BUCKET   → Storage bucket name (default: tracks)
supabase.url=${SUPABASE_URL}
supabase.anonKey=${SUPABASE_ANON_KEY}
supabase.bucketName=${SUPABASE_BUCKET:tracks}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.mformusic=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN


mlops.fastapi.enabled=${MLOPS_FASTAPI_ENABLED:true}
mlops.fastapi.url=${MLOPS_FASTAPI_URL:http://localhost:8000}

# ── Spring Application Name (used by Actuator & Micrometer labels) ────────────
spring.application.name=mformusic-backend

# ── Actuator & Prometheus Metrics (Phase 8) ───────────────────────────────────
# Expose health + prometheus only; info/env kept off by default
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
# Tag every metric with the service name for multi-service Grafana dashboards
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=${SPRING_PROFILES_ACTIVE:local}
# HikariCP pool metrics (connection wait time, active connections)
management.metrics.enable.hikaricp=true
# JVM GC / memory / threads
management.metrics.enable.jvm=true

# ── Kafka Event Bus (Phase 9) ─────────────────────────────────────────────────
# KAFKA_BOOTSTRAP_SERVERS → e.g. broker1:9092,broker2:9092 (Confluent Cloud / local)
# Set KAFKA_TELEMETRY_ENABLED=false to fall back to direct HTTP forwarding
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=false

# Telemetry topic name — must match mlops consumer config
kafka.topic.telemetry=mformusic.telemetry.interactions
# Set false to keep using HTTP forwarding even when Kafka is present
kafka.telemetry.enabled=${KAFKA_TELEMETRY_ENABLED:false}