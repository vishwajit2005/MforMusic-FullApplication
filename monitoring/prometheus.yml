global:
  scrape_interval: 15s       # How often to collect metrics
  evaluation_interval: 15s   # How often to evaluate alerting rules
  external_labels:
    env: local               # docker-compose stack. Change when you point this file at a real deployment.
    project: mformusic

# Alert rule files
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# Alertmanager is NOT part of docker-compose.yml, so alert delivery is disabled by default
# (rules still evaluate and are visible at http://localhost:9090/alerts).
# To deliver alerts, add an alertmanager service and uncomment:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# ── Scrape targets ─────────────────────────────────────────────────────────────
scrape_configs:

  # Self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot backend is intentionally disabled for deployed monitoring because
  # /actuator/prometheus on Render is not configured or exposed.
  # - job_name: mformusic-backend
  #   metrics_path: /actuator/prometheus
  #   scrape_interval: 10s
  #   static_configs:
  #     - targets: ["backend:8080"]

  # Deployed FastAPI MLOps service on Render (https://mformusic-mlops.onrender.com)
  - job_name: mformusic-mlops
    scheme: https
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 12s
    authorization:
      type: Bearer
      credentials_file: /run/metrics/token
    static_configs:
      - targets: ["mformusic-mlops.onrender.com"]
        labels:
          service: fastapi-mlops
          environment: render

  # Kafka broker JMX metrics (requires JMX exporter sidecar in production)
  # - job_name: kafka
  #   static_configs:
  #     - targets: ["kafka:9308"]
