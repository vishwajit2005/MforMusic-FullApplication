global:
  scrape_interval: 15s       # How often to collect metrics
  evaluation_interval: 15s   # How often to evaluate alerting rules
  external_labels:
    env: production
    project: mformusic

# Alert rules file
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# Alertmanager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# ── Scrape targets ─────────────────────────────────────────────────────────────
scrape_configs:

  # Self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot — Micrometer / Actuator
  # Update host:port to match your Render.com service domain in production
  - job_name: mformusic-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: spring-boot
          environment: docker
    # Production override — uncomment and replace with Render domain:
    # - targets: ["mformusic-backend.onrender.com"]

  # FastAPI MLOps — prometheus-fastapi-instrumentator
  - job_name: mformusic-mlops
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["mlops:8000"]
        labels:
          service: fastapi-mlops
          environment: docker

  # Kafka broker JMX metrics (requires JMX exporter sidecar in production)
  # - job_name: kafka
  #   static_configs:
  #     - targets: ["kafka:9308"]
